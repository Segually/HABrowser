<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231f20; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; background: #231f20; }
      #load-status { position: absolute; color: white; font: 16px sans-serif; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="load-status">Loading…</div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.getElementById('unity-canvas');
      var statusText = document.getElementById('load-status');
      function resizeCanvas() {
        var width = Math.max(1, Math.min(window.innerWidth, window.innerHeight * 16 / 9));
        canvas.style.width = width + 'px';
        canvas.style.height = width * 9 / 16 + 'px';
        canvas.width = Math.max(1, Math.round(Math.min(width, 1280)));
        canvas.height = Math.max(1, Math.round(canvas.width * 9 / 16));
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
      }, function(progress) {
        statusText.textContent = 'Loading… ' + Math.round(progress * 100) + '%';
      }).then(function(instance) {
        statusText.remove();
        canvas.focus();
      }).catch(function(error) {
        statusText.textContent = 'Unable to load: ' + error;
      });
    </script>
  </body>
</html>
